<section class="section section--alt" id="past">
  <div class="container section__inner--narrow">
    <h2 class="section__title">Past Events</h2>
    <p class="section__lead">Archive of previous meetings and presentations.</p>

    {{ $past := (partial "events-by-status.html" .).past }}
    <ul class="event-list" role="list" data-events="past"{{ if not $past }} hidden{{ end }}>
      {{ range $past }}
      {{ partial "event-card.html" (dict "event" . "state" "past") }}
      {{ end }}
    </ul>
    <p class="event-list__empty" data-events-empty="past"{{ if $past }} hidden{{ end }}>No past events recorded yet.</p>
  </div>
</section>
