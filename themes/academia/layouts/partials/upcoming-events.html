<section class="section" id="upcoming">
  <div class="container section__inner--narrow">
    <h2 class="section__title">Upcoming Events</h2>
    <p class="section__lead">Our next quarterly meetings and talks.</p>

    {{ $upcoming := (partial "events-by-status.html" .).upcoming }}
    <ul class="event-list" role="list" data-events="upcoming"{{ if not $upcoming }} hidden{{ end }}>
      {{ range $upcoming }}
      {{ partial "event-card.html" (dict "event" . "state" "upcoming") }}
      {{ end }}
    </ul>
    <p class="event-list__empty" data-events-empty="upcoming"{{ if $upcoming }} hidden{{ end }}>No upcoming events scheduled yet, check back soon.</p>
  </div>
</section>
